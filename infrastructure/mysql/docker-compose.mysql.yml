services:

  # MYSQL SERVER
  mysql:
    image: mysql:8.4
    container_name: hrms-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      LEAVE_DB_USER: ${LEAVE_DB_USER}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD}

      RECRUITMENT_DB_USER: ${RECRUITMENT_DB_USER}
      RECRUITMENT_DB_PASSWORD: ${RECRUITMENT_DB_PASSWORD}

      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro

    networks:
      - hrms-network

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10

  # PHPMYADMIN (Interface Web pour MySQL uniquement)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hrms-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8082:80"
    depends_on:
      - mysql
    networks:
      - hrms-network

volumes:
  mysql_data:
