services:
    # POSTGRESQL SERVER
  postgres:
    image: postgres:17
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: keycloak
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      EMPLOYEE_DB_USER: ${EMPLOYEE_DB_USER}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
      PAYROLL_DB_USER: ${PAYROLL_DB_USER}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  #Interface Web pour PostgreSQL uniquement
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hrms-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hrms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8083:80"
    depends_on:
      - postgres
    networks:
      - hrms-network

volumes:
  postgres_data:
